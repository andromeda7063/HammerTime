[project]
name = "hammertime"
version = "0.1.0"
description = "HammerTime: Dynamic ST-GNN for Formula 1 Traffic Congestion and Lap-Time Slowdown Prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "fastf1>=3.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "xgboost>=2.0.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "streamlit>=1.33.0",
    "requests>=2.31.0",
]

[tool.uv]
package = false
link-mode = "copy"
